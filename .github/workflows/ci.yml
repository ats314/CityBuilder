name: ci

on:
  push:
    branches: [main]
  pull_request:

# The renderer has no build and no unit tests — its output is a WebGL frame, and
# a GLSL compile error fails at runtime rather than at build time. So the gate is
# to actually open the page in a browser and assert it draws.
jobs:
  render:
    name: renderer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python3 tools/smoke_test.py --shots shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: shots/
          if-no-files-found: ignore

  tools:
    name: baking tools import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python3 -m compileall -q tools
      # Import each baker without running it, so a broken top level or a missing
      # dependency is caught here rather than 40 minutes into a bake. smoke_test
      # is skipped: it needs playwright, which the render job covers by running it.
      - run: |
          for f in tools/*.py; do
            m=$(basename "$f" .py)
            [ "$m" = "smoke_test" ] && continue
            python3 -c "import importlib.util
spec = importlib.util.spec_from_file_location('$m', '$f')
spec.loader.exec_module(importlib.util.module_from_spec(spec))
print('imported $m')"
          done
